version: '3'

# Every task runs one command that can be executed directly without `task`.
tasks:
  gen:
    desc: Generate Go types from JSON Schema (runs from tools/ with relative paths)
    cmds:
      - cd tools && go tool go-jsonschema --tags json --capitalization ID --capitalization USD -p contracts -t -o ../core/contracts/contracts.gen.go ../contracts/jsonschema/common/v1.json ../contracts/jsonschema/decision/v1.json ../contracts/jsonschema/gate/v1.json ../contracts/jsonschema/outcome/v1.json ../contracts/jsonschema/report/v1.json ../contracts/jsonschema/events/v1.json

  gen:check:
    desc: Fail if generated contracts drift from committed files
    cmds:
      - go -C core test ./contracts -run TestGeneratedContractsMatch

  build:
    desc: Build all workspace modules
    cmds:
      - go build all

  test:
    desc: Test all workspace modules (fast; e2e and the 7-day run are separate tasks)
    cmds:
      - task: test:core
      - task: test:providers
      - task: test:tools
      - task: test:clients:python

  test:clients:python:
    desc: Test the Python client and the Freqtrade example on loopback
    cmds:
      - |
        if command -v python >/dev/null 2>&1; then
          py=python
        elif command -v python3 >/dev/null 2>&1; then
          py=python3
        else
          echo "Python 3 is required for examples/; install Python 3 and put 'python' or 'python3' on PATH" >&2
          exit 1
        fi
        "$py" -m unittest discover -s examples -p "test_*.py"

  test:core:
    desc: Test the core module in -short mode (the 7-day simulation has its own task)
    cmds:
      - go -C core test ./... -short

  test:7d:
    desc: Run the seven-day shadow simulation (slow, minutes; not part of `task check`)
    cmds:
      - go -C core test ./internal/app/shadow -run '^TestShadowSevenDays$' -count=1 -timeout 30m -v

  test:race:
    desc: Run the core tests with the race detector (skips the 7-day run; needs cgo)
    cmds:
      - |
        cc="$(go env CC)"
        set -- $cc
        if [ "$(go env CGO_ENABLED)" != "1" ] || ! command -v "$1" >/dev/null 2>&1; then
          echo "test:race needs cgo and a C compiler: CGO_ENABLED=$(go env CGO_ENABLED), CC=$cc." >&2
          echo "Windows: install mingw-w64 (MSYS2, or WinLibs) and put gcc on PATH, then run with CGO_ENABLED=1." >&2
          echo "Linux/macOS: install gcc or clang; cgo is usually enabled by default." >&2
          echo "No race detector on this machine: use 'task test:core' instead." >&2
          exit 1
        fi
        go -C core test -race -short ./...

  test:e2e:
    desc: HTTP+CLI end-to-end rehearsal against the local smokestub (slow, opt-in)
    cmds:
      - VEND_E2E=1 go -C tools test -count=1 ./e2e/...

  test:providers:
    desc: Test provider modules
    cmds:
      - task: test:providers:decision
      - task: test:providers:marketdata
      - task: test:providers:notify

  test:providers:decision:
    desc: Test the decision-drex provider
    cmds:
      - go -C providers/decision-drex test ./...

  test:providers:marketdata:
    desc: Test the marketdata-binance provider
    cmds:
      - go -C providers/marketdata-binance test ./...

  test:providers:notify:
    desc: Test the notify-telegram provider
    cmds:
      - go -C providers/notify-telegram test ./...

  test:tools:
    desc: Test the tools module
    cmds:
      - go -C tools test ./...

  lint:imports:
    desc: Check layer import rules
    cmds:
      - go run ./tools/lintimports

  check:
    desc: gen:check + lint + test + build (fast; see check:full)
    cmds:
      - task: gen:check
      - task: lint:imports
      - task: test
      - task: build

  check:full:
    desc: check plus the opt-in e2e rehearsal and the seven-day simulation
    cmds:
      - task: check
      - task: test:e2e
      - task: test:7d
